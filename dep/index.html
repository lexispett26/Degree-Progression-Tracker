<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Degree Progression Tracker</title>
    <style>
        .credit-summary {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 25px 0;
        }

        .credit-box {
            flex: 1;
            text-align: center;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .credit-box p {
            font-size: 40px;
            font-weight: bold;
            margin: 0;
        }

        #DS_list, #ISB_list, #core_list {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 12px;
        }

        li > label:first-child {
            flex: 1;
            font-weight: bold;
            min-width: 200px;
        }

        select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        li label {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Degree Progression Tracker</h1>

    <div class="credit-summary">
        <div class="credit-box">
            <h3>Data Science Credits Remaining</h3>
            <p id="DS-credits">--</p>
        </div>

        <div class="credit-box">
            <h3>ISB Credits Remaining</h3>
            <p id="ISB-credits">--</p>
        </div>

        <div class="credit-box">
            <h3>Core Credits Remaining</h3>
            <p id="core-credits">--</p>
        </div>

        <div class="credit-box">
            <h3>Total Credits Remaining</h3>
            <p id="total-credits">--</p>
        </div>

        <div class="credit-box">
            <h3>Average Per Semester</h3>
            <p id="average-credits">--</p>
        </div>



    </div>
    <h2>Data Science Requirements</h2>
    <ul id="DS_list"></ul>

    <h2>ISB Requirements</h2>
    <ul id="ISB_list"></ul>

    <h2>Core Curriculum</h2>
    <ul id="core_list"></ul>

    <script>
        function updateCredits() {
            fetch("/credits")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("DS-credits").innerText = data.DS;
                    document.getElementById("ISB-credits").innerText = data.ISB;
                    document.getElementById("core-credits").innerText = data.core;
                    document.getElementById("total-credits").innerText = data.total;
                    document.getElementById("average-credits").innerText = (data.total / 7).toFixed(1);
                });
        }

        updateCredits();

        fetch("/courses")
            .then(response => response.json())
            .then(data => {
                const DSList = document.getElementById("DS_list");
                const ISBList = document.getElementById("ISB_list");
                const coreList = document.getElementById("core_list");

                for (let i = 0; i < data.length; i++) {
                    const li = document.createElement("li");

                    const label = document.createElement("label");
                    label.innerText = data[i].label;
                    li.appendChild(label);

                    const numberOfCourses = data[i].required || 1;

                    for (let j = 0; j < numberOfCourses; j++) {

                        // Create dropdown
                        const select = document.createElement("select");

                        const placeholder = document.createElement("option");
                        placeholder.value = "";
                        placeholder.innerText = "Choose a course";
                        select.appendChild(placeholder);

                        for (let course of data[i].allowed) {
                            const option = document.createElement("option");
                            option.value = course;
                            option.innerText = course;
                            select.appendChild(option);
                        }

                        // Restore selection from Java
                        select.value = data[i].selectedCourses?.[j] || "";
                        li.appendChild(select);

                        // Create checkbox
                        const checkbox = document.createElement("input");
                        checkbox.type = "checkbox";
                        checkbox.checked = data[i].completedCourses?.[j] || false;
                        checkbox.disabled = !select.value;

                        const checkboxLabel = document.createElement("label");
                        checkboxLabel.appendChild(checkbox);
                        checkboxLabel.appendChild(
                            document.createTextNode(" Completed")
                        );
                        li.appendChild(checkboxLabel);

                        // Send changes to Java
                        function sendUpdate() {
                            fetch("/update-course", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    index: i,
                                    slot: j,
                                    selected: select.value,
                                    completed: checkbox.checked
                                })
                            })
                                .then(response => {
                                    if (!response.ok) {
                                        throw new Error("Update failed");
                                    }

                                    updateCredits();
                                })
                                .catch(error => console.error(error));
                        }

                        select.addEventListener("change", () => {
                            checkbox.checked = false;
                            checkbox.disabled = !select.value;
                            sendUpdate();
                        });

                        checkbox.addEventListener("change", sendUpdate);
                    }

                    // Put requirement in the correct section
                    if (data[i].block === "Major in Data Science (Mathematics)") {
                        DSList.appendChild(li);
                    }
                    else if (data[i].block === "Major in Integrated Sci & Business") {
                        ISBList.appendChild(li);
                    }
                    else {
                        coreList.appendChild(li);
                    }
                }
            })
            .catch(error => console.error("Error loading courses:", error));


    </script>

</body>
</html>
